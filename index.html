<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Att göra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>
  <body>
    <div class="container d-flex flex-column align-items-center">
      <h1 class="m-3">Att göra:</h1>
      <ul
        class="list-group list-group-flush"
        id="lista"></ul>
      <div class="m-3">
        <input
          type="text"
          id="input"
          placeholder="Vad behöver du få gjort?" />
        <button id="submit">Lägg till</button>
        <button id="reset">Återställ listan</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
